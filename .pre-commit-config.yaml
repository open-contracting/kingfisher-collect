ci:
  autoupdate_schedule: quarterly
  skip: [pip-compile]
default_language_version:
    python: python3.10
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.26
    hooks:
      - id: pip-compile
        name: pip-compile requirements_base.in
        args: [requirements_base.in, -o, requirements_base.txt, --python-platform, linux]
        files: ^requirements_base\.(in|txt)$
      - id: pip-compile
        name: pip-compile requirements.in
        args: [requirements.in, -o, requirements.txt, --python-platform, linux]
        files: ^requirements(_base)?\.(in|txt)$
      - id: pip-compile
        name: pip-compile requirements_dev.in
        args: [requirements_dev.in, -o, requirements_dev.txt, --python-platform, linux]
        files: ^requirements(_base|_dev)?\.(in|txt)$
  - repo: https://github.com/scrapy/scrapy-lint
    rev: v0.1.1
    hooks:
      - id: scrapy-lint
  - repo: local
    hooks:
      - id: sha256sum
        name: sha256sum
        entry: sh -c 'sha256sum requirements.txt > requirements.txt.sha256'
        language: unsupported
        files: ^requirements\.txt$
        pass_filenames: false
      - id: scrapy-checkall
        name: scrapy-checkall
        language: python
        entry: scrapy checkall --loglevel=WARNING
        files: ^kingfisher_scrapy/spiders
        # Keep in sync with requirements_base.in.
        additional_dependencies:
          - curl_cffi
          - flattentool
          - form2request
          - ijson
          - jsonpointer
          - jsonref
          - ocdskit
          - orjson
          - pathvalidate
          - psycopg[binary]
          - pydantic
          - rarfile
          - requests
          - scrapy>=2.15
          - scrapyd
          - scrapyd-client
          - sentry-sdk
          - twisted
          - yapw
